services:
  math:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      COOKIE_SECURE: "true"
      AUDELA_OIDC_ISSUER: ${AUDELA_OIDC_ISSUER:-https://www.audeladedonnees.fr}
      AUDELA_OIDC_CLIENT_ID: ${AUDELA_OIDC_CLIENT_ID:-}
      AUDELA_OIDC_CLIENT_SECRET: ${AUDELA_OIDC_CLIENT_SECRET:-}
      AUDELA_OIDC_REDIRECT_URI: ${AUDELA_OIDC_REDIRECT_URI:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
